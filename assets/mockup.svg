<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640">
  <!-- 页面背景 -->
  <rect width="360" height="640" rx="30" fill="#fef7e0"/>
  <!-- 标题 -->
  <text x="180" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#8b4513" font-family="'PingFang SC','Microsoft YaHei',sans-serif">功德木鱼</text>
  <!-- 木鱼：金色圆 + 木鱼 emoji -->
  <circle cx="180" cy="240" r="92" fill="#ffd966" stroke="#e6b84d" stroke-width="2"/>
  <text x="180" y="283" text-anchor="middle" font-size="92">🥁</text>
  <!-- 阴影 -->
  <ellipse cx="180" cy="348" rx="80" ry="12" fill="rgba(0,0,0,0.08)"/>
  <!-- 功德计数 -->
  <text x="180" y="405" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e7d32" font-family="'PingFang SC','Microsoft YaHei',sans-serif">功德：666</text>
  <!-- 敲击按钮 -->
  <rect x="72" y="440" width="216" height="54" rx="27" fill="#ff9800"/>
  <text x="180" y="476" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff" font-family="'PingFang SC','Microsoft YaHei',sans-serif">敲击木鱼</text>
  <!-- 重置按钮 -->
  <rect x="72" y="510" width="216" height="54" rx="27" fill="#9e9e9e"/>
  <text x="180" y="546" text-anchor="middle" font-size="22" fill="#ffffff" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重置功德</text>
  <!-- 底部提示 -->
  <text x="180" y="606" text-anchor="middle" font-size="13" fill="#aaaaaa" font-family="'PingFang SC','Microsoft YaHei',sans-serif">点击木鱼或按钮，每次增加1功德</text>
</svg>
